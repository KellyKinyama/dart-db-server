name: dart_db_server
description: >
  A pure-Dart SQL database engine built as a drop-in Oracle replacement, with
  MySQL wire compatibility — a broad Oracle SQL dialect, Oracle & MySQL wire
  protocols, plus a built-in vector search engine and FTS5-lite full-text
  search.
version: 0.1.5
homepage: https://github.com/KellyKinyama/dart-db-server
repository: https://github.com/KellyKinyama/dart-db-server
issue_tracker: https://github.com/KellyKinyama/dart-db-server/issues
topics:
  - oracle
  - mysql
  - database
  - sql
  - vector-search

# Test-only cert/key used by TLS handshake tests; not a real credential.
false_secrets:
  - /test/fixtures/mysql_test_key.pem
  - /test/fixtures/mysql_test_cert.pem

environment:
  sdk: ^3.6.2

# Add regular dependencies here.
dependencies:
  # path: ^1.8.0
  crypto: ^3.0.3
  # AES-256-CBC, SHA-512 and PBKDF2 for the Oracle (TNS/TTC) wire auth
  # verifier side; the same primitives the sibling thin client uses. Range
  # spans 3.9+ and 4.x so the real-client validation project (which also pulls
  # the `oracledb` client, pinned to ^4.0.0) resolves to one shared version.
  pointycastle: ">=3.9.1 <5.0.0"

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
  # Used ONLY by the regression test suite under test/regression/ to
  # cross-check our engine against the reference implementation.
  # Requires the sqlite3 native shared library to be available at test
  # time; tests skip themselves if it isn't. Not used by production code.
  sqlite3: ^2.4.0
  mysql_client: ^0.0.27
